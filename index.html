<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Inventario</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- ==========================================
       APP
       ========================================== -->

  <div id="app">

    <!-- HEADER -->

    <header class="app-header">

      <div class="header-left">

        <button
          class="icon-button"
          id="btn-back"
          title="Volver"
        >
          <span class="material-symbols-outlined">
            arrow_back
          </span>
        </button>

        <div class="header-title-container">

          <h1 id="page-title">
            Control de Inventario
          </h1>

          <span id="page-subtitle"></span>

        </div>

      </div>

      <div class="header-right">

        <button
          class="icon-button"
          id="btn-theme"
          title="Cambiar tema"
        >
          <span class="material-symbols-outlined">
            dark_mode
          </span>
        </button>

      </div>

    </header>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
         ========================================== -->

    <main id="main-content">


      <!-- ========================================
           1. VISTA: LISTA DE ZONAS
           ======================================== -->

      <section
        id="zones-view"
        class="view-section"
      >

        <div class="info-banner">

          <span class="material-symbols-outlined">
            backup
          </span>

          <div>

            <strong>
              Respaldo y restauración
            </strong>

            <p>
              Guarda todo en un archivo JSON y luego
              impórtalo en otra página o navegador
              para recuperar tus datos.
            </p>

          </div>

        </div>


        <div class="backup-actions">

          <button
            class="btn btn-primary btn-sm"
            id="btn-backup-export"
          >
            Guardar respaldo
          </button>

          <button
            class="btn btn-outlined btn-sm"
            id="btn-backup-import"
          >
            Cargar respaldo
          </button>

        </div>


        <!-- Buscador de Zonas -->

        <div class="search-box">

          <div class="input-with-icon">

            <span class="material-symbols-outlined search-icon">
              search
            </span>

            <input
              type="text"
              id="zone-search-input"
              class="input-field"
              placeholder="Buscar zona por nombre..."
            >

          </div>

        </div>


        <!-- Grid de Tarjetas de Zonas -->

        <div
          id="zones-list-container"
          class="zones-grid"
        >
          <!-- Renderizado dinámico desde JS -->
        </div>


        <!-- Botón Flotante -->

        <button
          class="fab"
          id="fab-add-zone"
          title="Nueva Zona"
        >

          <span class="material-symbols-outlined">
            add
          </span>

        </button>

      </section>



      <!-- ========================================
           2. VISTA: DETALLE DE ZONA
           ======================================== -->

      <section
        id="zone-detail-view"
        class="view-section hidden"
      >


        <!-- Selector de Sub-Vistas -->

        <div class="view-toggle-bar">

          <button
            class="toggle-view-btn active"
            id="btn-toggle-articles"
          >

            <span class="material-symbols-outlined text-icon">
              category
            </span>

            Artículos

          </button>


          <button
            class="toggle-view-btn"
            id="btn-toggle-novelties"
          >

            <span class="material-symbols-outlined text-icon">
              assignment_late
            </span>

            Novedades / Tareas

          </button>

        </div>



        <!-- ======================================
             SUB-VISTA: ARTÍCULOS
             ====================================== -->

        <div
          id="articles-sub-view"
          class="sub-view-container"
        >


          <!-- Estadísticas -->

          <div
            id="stats-container"
            class="stats-grid"
          >
            <!-- Renderizado dinámico desde JS -->
          </div>


          <!-- Buscador de Artículos -->

          <div class="search-box">

            <div class="input-with-icon">

              <span class="material-symbols-outlined search-icon">
                search
              </span>

              <input
                type="text"
                id="article-search-input"
                class="input-field"
                placeholder="Buscar por ID o Nombre..."
              >

            </div>

          </div>


          <!-- Barra de Filtros -->

          <nav
            class="filter-bar"
            id="filter-bar"
          >

            <button
              class="filter-tab active"
              data-filter="todos"
            >
              Todos
            </button>

            <button
              class="filter-tab"
              data-filter="pendientes"
            >
              Pendientes
            </button>

            <button
              class="filter-tab"
              data-filter="verificados"
            >
              Verificados
            </button>

            <button
              class="filter-tab"
              data-filter="faltantes"
            >
              Faltantes
            </button>

            <button
              class="filter-tab"
              data-filter="sobrantes"
            >
              Sobrantes
            </button>

          </nav>


          <!-- Lista de Artículos -->

          <div
            id="articles-list-container"
            class="articles-list"
          >
            <!-- Renderizado dinámico desde JS -->
          </div>


          <!-- Botón Nuevo Artículo -->

          <button
            class="fab"
            id="fab-add-article"
            title="Nuevo Artículo"
          >

            <span class="material-symbols-outlined">
              add
            </span>

          </button>

        </div>



        <!-- ======================================
             SUB-VISTA: NOVEDADES
             ====================================== -->

        <div
          id="novelties-sub-view"
          class="sub-view-container hidden"
        >


          <!-- Estadísticas -->

          <div
            id="novelty-stats-container"
            class="stats-grid"
          >
            <!-- Renderizado dinámico desde JS -->
          </div>


          <!-- Lista de Novedades -->

          <div
            id="novelties-list-container"
            class="articles-list"
          >
            <!-- Renderizado dinámico desde JS -->
          </div>


          <!-- Botón Nueva Novedad -->

          <button
            class="fab"
            id="fab-add-novelty"
            title="Nueva Novedad / Tarea"
          >

            <span class="material-symbols-outlined">
              add_comment
            </span>

          </button>

        </div>

      </section>

    </main>



    <!-- ==========================================
         MODALES
         ========================================== -->

    <div
      id="modal-container"
      class="modal-container hidden"
    ></div>


    <!-- ==========================================
         TOASTS
         ========================================== -->

    <div
      id="toast-container"
      class="toast-container"
    ></div>



    <!-- ==========================================
         SUPABASE
         ========================================== -->

    <script>

      /*
       * Configuración de Supabase
       */

      window.SUPABASE_URL =
        "https://rserzjanocqmgubdevow.supabase.co";

      window.SUPABASE_ANON_KEY =
        "sb_publishable_O4xu90RCVX9IRDT72uEdaQ_-94TUNrz";

    </script>


    <!-- ==========================================
         CARGAR SDK DE SUPABASE
         ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ==========================================
         CREAR CLIENTE SUPABASE
         ========================================== -->

    <script>

      if (
        window.supabase &&
        typeof window.supabase.createClient === "function"
      ) {

        window.supabaseClient =
          window.supabase.createClient(
            window.SUPABASE_URL,
            window.SUPABASE_ANON_KEY
          );

        console.log(
          "[Supabase] Cliente inicializado correctamente"
        );

      } else {

        console.error(
          "[Supabase] No se pudo cargar el SDK de Supabase"
        );

      }

    </script>


    <!-- ==========================================
         ARCHIVOS DE LA APLICACIÓN
         ========================================== -->

    <script src="js/data.js"></script>

    <script src="js/storage.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/app.js"></script>


  </body>
</html>
